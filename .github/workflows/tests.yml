name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: api_reliability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d api_reliability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: api_reliability_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      JWT_SECRET_KEY: ci-only-signing-key-not-for-real-accounts-2026
      PRODUCTS_CACHE_ENABLED: "true"
      SQL_ECHO: "false"
      CORS_ORIGINS: "[]"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.0"
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --no-sync pytest -q
